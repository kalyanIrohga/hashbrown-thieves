let basketShakeTimer = 0;

let bgPotatoes = [];

let farmerTimer = 180;         
let nextAction = "NORMAL";     
let farmerGraceTimer = 0;      

let ambientSteam = []; 
let potatoSteam = [];  
let fxPotatoes = []; 

let bubbleText = "";
let bubbleTimer = 0;
let bubbleX = 0;
let bubbleY = 0;

let level2Phase = 0; 

let storyDialogues = [];
let storyIndex = 0;
let textTypeTimer = 0;
let currentDisplayedText = "";

// 关卡开头的剧情对话配置

    ],

    3: [

// 游戏内互动对话

    1: {
        stretch: {
            MARTEN: [
                "稳住……就是现在！",
                "别回头别回头别回头——",
                "再一点点，马上就到手了…！"
            ]
        },
        success: {

                "轻轻松松~",
                "咔哧咔哧♪",

            ]
        }
    },
    2: {

            MARTEN: [ "就是现在，快上啊！" ],

        },
        success: {

            BEAR: [ "嘿嘿，真香~" ]
        },
        reply: {

        }
    },
    3: {
        stretch: {
            MARTEN: [

            ],

            ]
        },
        success: {
            MARTEN: [
                "呼……好险好险。",
                "学着点！",
                "哼哼♪"
            ],
            BEAR: [

                "刚才好险……我薯饼差点掉了。"
            ]
        },
        reply: {
            MARTEN: [
                "你关心的是这个？！",
                "小心点，看准时机！"
            ]
        }
    },
    4: {
        stretch: {
            MARTEN: [
                "这大块头，一起使劲！",
                "专心搬，别看漏了！",

            ],
            BEAR: [
                "头好痛哦，但是薯饼好香…",
                "好重啊，要拿不动了……",

            ]
        },
        success: {
            MARTEN: [
                "把你篮子都偷光！",

                "大获丰收，大获丰收~♪"
            ],
            BEAR: [
                "唔姆唔姆……好吃！",
                "嘿嘿，又拿到两个！",

            ]
        },
        reply: {
            MARTEN: [ "冲啊，全搬走！" ],
            BEAR: [ "唔姆唔姆……" ]
        }

};

let selectedFailText = "";
let selectedFailSpeaker = ""; 

function setup() {
    let canvasWidth = windowWidth;
    let canvasHeight = windowHeight;
    if (canvasWidth > 500) canvasWidth = 430; 
    let cnv = createCanvas(canvasWidth, canvasHeight);
    canvasEl = cnv.elt;   // 保存真实 canvas 节点
    
    if(!localStorage.getItem("marten_bear_max_level")) {
        localStorage.setItem("marten_bear_max_level", 1);
        localStorage.setItem("marten_bear_current_level", 1);
    }
    loadProgress();
    
    for (let i = 0; i < 12; i++) {
        bgPotatoes.push({
            x: random(width),
            y: random(height),
            size: random(20, 50),
            speedX: random(-0.5, 0.5),
            speedY: random(0.5, 1.5),
            angle: random(TWO_PI),
            rotSpeed: random(-0.02, 0.02)
        });
    }
    
    initLevel(currentLevel);
}

function draw() {
    background('#3a221d'); 
    noStroke();
    fill('#4a2f28');
    ellipse(width*0.5, height*0.3, width*1.2, height*0.6);

    if (currentScreen === "HOME") {
        drawHomeScreen();
    } else if (currentScreen === "LEVEL_SELECT") {
        drawLevelSelectScreen();
    } else if (currentScreen === "STORY") {
        drawStoryScreen();
    } else {
        if (currentScreen === "PLAYING" && !showLevel2Guide) updateGame();
        
        drawGame();
        
        if (showLevel2Guide) drawLevel2GuideWindow(); 
        if (currentScreen === "PAUSE") drawPauseMenu();
        if (currentScreen === "GAMEOVER") drawGameOverScreen();
        if (currentScreen === "WIN_LEVEL") drawWinLevelScreen();
        if (currentScreen === "GAME_CLEAR") drawGameClearScreen();
    }
}

function initLevel(lvl) {
    currentLevel = lvl;
    hashBrownsCount = 0;
    stealProgress = 0;
    playerActionState = "IDLE";
    currentTurn = "MARTEN";
    level2Phase = 0; 
    farmerState = "COOKING";
    farmerTimer = 180;
    farmerGraceTimer = 0;
    bubbleTimer = 0;
    fxPotatoes = [];
    ambientSteam = [];
    potatoSteam = [];
    showLevel2Guide = false;
    decideNextAction();

    storyDialogues = LEVEL_START_STORIES[lvl] || [];
    storyIndex = 0;
    currentScreen = "STORY";
    startStoryLine();
}

function startStoryLine() {
    if(storyIndex < storyDialogues.length) {
        let line = storyDialogues[storyIndex];
        currentDisplayedText = line.text; 
    }
}

function decideNextAction() {
    let r = random(100);
    if (currentLevel >= 3 && r < 30) {
        nextAction = "DOUBLE";  
    } else {
        let r2 = random(100);
        if (r2 < 45) nextAction = "NORMAL";
        else if (r2 < 75) nextAction = "FAKE";
        else nextAction = "SUDDEN";
    }
}

function triggerBubble(textStr, x, y) {
    bubbleText = textStr;
    bubbleTimer = 1.8 * FPS;
    bubbleX = x;
    bubbleY = y;
}

function spawnPotatoFX(count) {
    for(let i=0; i<count; i++) {
        fxPotatoes.push({
            x: width * 0.6 + 35,
            y: height * 0.42,
            tx: width * 0.15 + (i * 18), 
            ty: 40,
            angle: random(TWO_PI),
            rotSpeed: random(-0.1, 0.1),
            timer: 25 + (i * 8) 
        });
    }
}

function updateGame() {
    let config = LEVEL_CONFIGS[currentLevel];
    
    farmerTimer--;
    if (farmerGraceTimer > 0) farmerGraceTimer--;

    if (playerActionState === "STEALING" && frameCount % 100 === 0 && random(100) < 40) {
        let list = LEVEL_IN_GAME_DIALOGUES[currentLevel].stretch[currentTurn];
        if (list && list.length > 0) {
            let yy = (currentTurn === "MARTEN") ? height * 0.58 : height * 0.72;
            triggerBubble(random(list), width * 0.3, yy);
        }
    }

    if (frameCount % 6 === 0) {
    ambientSteam.push({
        x: width * 0.32, 
        y: height * 0.24, 
        vx: random(-0.4, 0.4), 
        vy: random(-1.2, -2.2), 
        alpha: 160, 
        size: random(6, 14)
    });
    }
    if (frameCount % 12 === 0) {
        potatoSteam.push({x: width*0.6 + random(10, 60), y: height*0.41, vy: random(-0.3, -0.8), alpha: 100});
    }

    for (let i = ambientSteam.length - 1; i >= 0; i--) {
        ambientSteam[i].x += ambientSteam[i].vx;
        ambientSteam[i].y += ambientSteam[i].vy;
        ambientSteam[i].alpha -= 3;
        if (ambientSteam[i].alpha <= 0) ambientSteam.splice(i, 1);
    }
    for (let i = potatoSteam.length - 1; i >= 0; i--) {
        potatoSteam[i].y += potatoSteam[i].vy;
        potatoSteam[i].alpha -= 2;
        if (potatoSteam[i].alpha <= 0) potatoSteam.splice(i, 1);
    }

    if (farmerTimer <= 0) {
        if (farmerState === "COOKING") {
            if (nextAction === "NORMAL" || nextAction === "FAKE") {
                farmerState = "SUSPICIOUS";
                farmerTimer = random(50, 80); 
            } else if (nextAction === "SUDDEN") {
                farmerState = "TURNING";
                farmerTimer = random(80, 110); 
                farmerGraceTimer = 0.4 * FPS; 
            } else if (nextAction === "DOUBLE") {
                farmerState = "SUSPICIOUS";
                farmerTimer = random(40, 60);
            }
        } 
        else if (farmerState === "SUSPICIOUS") {
            if (nextAction === "NORMAL" || nextAction === "DOUBLE") {
                farmerState = "TURNING";
                farmerTimer = random(70, 100); 
                farmerGraceTimer = 0.4 * FPS; 
            } else if (nextAction === "FAKE") {
                farmerState = "COOKING";
                farmerTimer = random(150, 240); 
                decideNextAction(); 
            }
        } 
        else if (farmerState === "TURNING") {
            if (nextAction === "DOUBLE") {
                farmerState = "DOUBLE_CHECK_DELAY";
                farmerTimer = 35; 
            } else {
                farmerState = "COOKING";
                decideNextAction();
                farmerTimer = (nextAction === "SUDDEN") ? random(250, 360) : random(160, 240);
            }
        }
        else if (farmerState === "DOUBLE_CHECK_DELAY") {
            farmerState = "DOUBLE_CHECK_TURN";
            farmerTimer = random(60, 90); 
            farmerGraceTimer = 0.4 * FPS; 
        }
        else if (farmerState === "DOUBLE_CHECK_TURN") {
            farmerState = "COOKING";
            decideNextAction();
            farmerTimer = random(160, 240);
        }
    }

    if (basketShakeTimer > 0) basketShakeTimer--;
    if (bubbleTimer > 0) bubbleTimer--;
    
    for(let i = fxPotatoes.length - 1; i >= 0; i--) {
        fxPotatoes[i].timer--;
        fxPotatoes[i].angle += fxPotatoes[i].rotSpeed;
        if(fxPotatoes[i].timer <= 0) fxPotatoes.splice(i, 1);
    }

    if (currentLevel === 4 && hashBrownsCount >= config.target - 2) {
        currentTurn = "BEAR"; 
    }

    if (playerActionState === "EATING") {
        eatingTimer--;
        if (eatingTimer <= 0) {
            playerActionState = "IDLE";
            if (currentLevel >= 2) {
                if (currentLevel === 2) {
                    if (level2Phase === 1) currentTurn = "BEAR";
                    else if (level2Phase === 2) currentTurn = "MARTEN";
                    else if (level2Phase === 3) currentTurn = "BEAR";
                } else {
                    if (currentLevel === 4 && hashBrownsCount >= config.target - 2) {
                        currentTurn = "BEAR";
                    } else {
                        currentTurn = (currentTurn === "MARTEN") ? "BEAR" : "MARTEN";
                    }
                }
            }
        }
    } 
    else if (playerActionState === "RETRACTING") {
        bearRetractTimer--;
        if (bearRetractTimer <= 0) {
            playerActionState = "EATING";
            eatingTimer = 1.5 * FPS;
        }
    }
    else {
        if (currentTurn === "MARTEN") {
            if (mouseIsPressed && mouseY > 80) {
                isStealing = true;
                playerActionState = "STEALING";
                stealProgress += 100 / (config.martenTime * FPS);
                if (stealProgress >= 100) {
                    if (currentLevel === 2 && level2Phase === 0) level2Phase = 1;
                    if (currentLevel === 2 && level2Phase === 2) level2Phase = 3;
                    handleStealSuccess(1);
                }
            } else {
                isStealing = false;
                playerActionState = "IDLE";
                stealProgress = 0; 
            }
        } 
        else {
            if (stealProgress > 0) {
                playerActionState = "STEALING";
                if (!mouseIsPressed) {
                    stealProgress -= 0.5; 
                }
                if (stealProgress >= 100) {
                    if (currentLevel === 2 && level2Phase === 1) level2Phase = 2;
                    if (currentLevel === 2 && level2Phase === 3) level2Phase = 4;
                    handleStealSuccess(2);
                }
            } else {
                isStealing = false;
                playerActionState = "IDLE";
                stealProgress = 0;
            }
        }
    }

    let isFarmerWatching = (farmerState === "TURNING" || farmerState === "DOUBLE_CHECK_TURN");
    let isPlayerExposed = (playerActionState === "STEALING" || playerActionState === "RETRACTING");

    if (isFarmerWatching && isPlayerExposed && farmerGraceTimer <= 0) {
        let caughtWho = currentTurn; 
        currentScreen = "GAMEOVER";
        isStealing = false;
        stealProgress = 0;
        selectFailDialogue(caughtWho);
    }
}

function selectFailDialogue(caughtWho) {
    if (currentLevel === 1) {
        selectedFailSpeaker = "MARTEN";
        let r1 = [
            "哈？怎么可能，我已经很小声了！！",
            "不算不算，刚才没认真。",
            "可恶！下次绝不失手。"
        ];
        selectedFailText = random(r1);
    } 
    else if (currentLevel === 2) {
        if (caughtWho === "MARTEN") { 
            selectedFailSpeaker = "BEAR";
            let r2_marten = [
                "「貂貂……貂貂去哪里了？那她那份，我先替她保管。」",
                "「别怕，我这就去救你……诶，房子的门在哪里？」"
            ];
            selectedFailText = random(r2_marten);
        } else { 
            selectedFailSpeaker = "MARTEN";
            let r2_bear = [
                "「叫你手脚快点！……谁让你贪那一口的啦！」",
                "「笨熊！…学着点，再来一次！」"
            ];
            selectedFailText = random(r2_bear);
        }
    } 
    else if (currentLevel === 3) {
        if (caughtWho === "BEAR") { 
            selectedFailSpeaker = "MARTEN";
            let r3_bear = [
                "「叫你别愣着！」",
                "「都怪你！」"
            ];
            selectedFailText = random(r3_bear);
        } else { 
            selectedFailSpeaker = "BEAR";
            let r3_marten = [
                "「她还没吃到呢，太遗憾了…」",
                "「饼…饼……」"
            ];
            selectedFailText = random(r3_marten);
        }
    } 
    else if (currentLevel === 4) {
        if (caughtWho === "BEAR") { 
            selectedFailSpeaker = "MARTEN";
            let r4_bear = [
                "「就差最后一点儿！都怪你个大馋鬼！」",
                "「别愣着，快跑哇！」"
            ];
            selectedFailText = random(r4_bear);
        } else { 
            selectedFailSpeaker = "BEAR";
            let r4_marten = [
                "「貂被抓了……（低头看地上的薯饼）……那，这个我先吃？」",
                "「别急貂，我救你！……（嚼）……吃完就救。」"
            ];
            selectedFailText = random(r4_marten);
        }
    }
}

function handleStealSuccess(gotCount) {
    let config = LEVEL_CONFIGS[currentLevel];
    hashBrownsCount += gotCount;
    if (hashBrownsCount > config.target) hashBrownsCount = config.target;
    
    stealProgress = 0;
    isStealing = false;
    spawnPotatoFX(gotCount);
    
    if (currentLevel === 4 && hashBrownsCount === 9) {
        triggerBubble("我从来没见到过这么多薯饼……", width * 0.3, height * 0.72);
        
        setTimeout(() => { 
            if(currentScreen === "PLAYING") {
                triggerBubble("这一堆是我的，这一堆也是我的。", width * 0.3, height * 0.72); 
            }
        }, 2000);
        
        setTimeout(() => { 
            if(currentScreen === "PLAYING") {
                triggerBubble("你怎么已经开吃了？喂，不许再吃了！", width * 0.3, height * 0.58); 
            }
        }, 4000);
        
        setTimeout(() => { 
            if(currentScreen === "PLAYING") {
                triggerBubble("嚼嚼，好嘛，嚼嚼……", width * 0.3, height * 0.72); 
            }
        }, 6000);
    } 
    else {
        let list = LEVEL_IN_GAME_DIALOGUES[currentLevel].success[currentTurn];
        if (list && list.length > 0) {
            let yy = (currentTurn === "MARTEN") ? height * 0.58 : height * 0.72;
            triggerBubble(random(list), width * 0.3, yy);
        }
    }

    if (hashBrownsCount >= config.target) {
        let nextLvl = currentLevel + 1;
        saveProgress(nextLvl);
        currentScreen = (currentLevel === 4) ? "GAME_CLEAR" : "WIN_LEVEL";
        return;
    }

    if (currentLevel >= 2 && currentTurn === "BEAR") {
        playerActionState = "RETRACTING";
        bearRetractTimer = 0.45 * FPS; 
        basketShakeTimer = 35;         
    } else {
        playerActionState = "EATING";
        eatingTimer = 1.5 * FPS;
    }
}

function drawGame() {
    let config = LEVEL_CONFIGS[currentLevel];
    textAlign(CENTER, CENTER);

    noStroke();

    // 1. 先绘制底层背景色块
    fill('#1a0f0d'); rect(width * 0.1, height * 0.1, width * 0.8, height * 0.4, 12); 
    fill('#5d4037'); rect(width * 0.05, height * 0.48, width * 0.9, 22, 6);
    fill('#4e342e'); rect(width * 0.05, height * 0.51, width * 0.9, 6);

    // 2. 将烟雾绘制移动到这里（背景色块之后，这样它们就不会被盖住）
    for (let s of ambientSteam) {
        fill(240, 240, 240, s.alpha);
        ellipse(s.x, s.y, s.size);
    }

    for (let ps of potatoSteam) {
        fill(255, 183, 77, ps.alpha);
        ellipse(ps.x, ps.y, 6, 12);
    }

    // 以下代码保持原样不变
    push();
    translate(width * 0.6, height * 0.41);
    if (basketShakeTimer > 0) translate(sin(frameCount * 1.2) * 6, 0); 
    fill('rgba(0,0,0,0.2)'); rect(-2, 3, 74, 35, 6);
    fill('#d7ccc8'); stroke('#b0bec5'); strokeWeight(1.5); rect(0, 0, 70, 35, 6); 
    noStroke();
    
    if (currentLevel === 4 && hashBrownsCount >= config.target - 2) {
        fill('#e65100'); ellipse(35, -5, 62, 24);
        fill('#fffbca'); ellipse(35, -5, 54, 16);
        fill('#e65100'); textSize(10); text("👑终极巨饼", 35, -3);
    } else {
        fill('#e65100'); ellipse(35, 2, 52, 16); 
        fill('#ffb74d'); ellipse(35, -1, 48, 14); 
        fill('#ffe082'); ellipse(35, -3, 40, 8); 
    }
    pop();

    push();
    translate(width * 0.4, height * 0.28);
    
    let panShakeY = 0; 
    if (farmerState === "COOKING") {
        panShakeY = sin(frameCount * 0.4) * 3; 
    }

    push();
    translate(-30, 0 + panShakeY);
    textSize(26);
    text("🍳", 0, 0);
    pop();

    if (farmerState === "COOKING" || farmerState === "DOUBLE_CHECK_DELAY") {
        fill('#558b2f'); rect(-22, -35, 44, 65, 4); 
        fill('#d7ccc8'); ellipse(0, -50, 26, 26);    
        fill('#4e342e'); ellipse(0, -62, 42, 8); 
        beginShape(); vertex(-12, -62); vertex(-10, -74); vertex(10, -74); vertex(12, -62); endShape(CLOSE);
    } else if (farmerState === "SUSPICIOUS") {
        fill('#ef6c00'); rect(-22, -35, 44, 65, 4);
        fill('#fdd835'); ellipse(-6, -50, 26, 26);
        fill('#4e342e'); ellipse(-6, -62, 42, 8); 
        beginShape(); vertex(-18, -62); vertex(-16, -74); vertex(4, -74); vertex(6, -62); endShape(CLOSE);
        fill('#ff9800'); textSize(36); text("❓", 10, -90);
    } else if (farmerState === "TURNING" || farmerState === "DOUBLE_CHECK_TURN") {
        if (farmerGraceTimer > 0) {
            fill('#f9a825'); rect(-22, -35, 44, 65, 4);
            fill('#ffcc80'); ellipse(0, -50, 26, 26);
            fill('#4e342e'); ellipse(0, -62, 42, 8); 
            beginShape(); vertex(-12, -62); vertex(-10, -74); vertex(10, -74); vertex(12, -62); endShape(CLOSE);
            fill(80); ellipse(-6, -49, 4, 1); ellipse(6, -49, 4, 1); 
            fill('#ef6c00'); textSize(22); text("⏳", 0, -95);
        } else {
            fill('#c62828'); rect(-22, -35, 44, 65, 4);
            fill('#ffcc80'); ellipse(0, -50, 26, 26);
            fill('#4e342e'); ellipse(0, -62, 42, 8); 
            beginShape(); vertex(-12, -62); vertex(-10, -74); vertex(10, -74); vertex(12, -62); endShape(CLOSE);
            fill(0); ellipse(-6, -50, 4, 4); ellipse(6, -50, 4, 4);
            fill('#f44336'); textSize(38); text("❗❗", 0, -98);
        }
    }
    pop();

    let bearY = height * 0.76;
    let martenY = height * 0.63;

    if (currentLevel >= 2) {
        push();
        translate(width * 0.3, bearY);
        fill('#5d4037'); ellipse(-24, 6, 18, 18); ellipse(24, 6, 18, 18); 
        fill('#8d6e63'); rect(-34, 0, 68, 90, 18); 
        fill('#f5f5f5'); ellipse(0, 35, 32, 24); 
        fill('#3e2723'); ellipse(-10, 25, 6, 6); ellipse(10, 25, 6, 6); 
        if (currentTurn === "BEAR" && playerActionState === "STEALING") {
            fill('#ff5252'); textStyle(BOLD); textSize(11); text("🦊💢 快点快点!!", 0, -14);
        }
        pop();
    }

    push();
    translate(width * 0.3, martenY);
    fill('#e0e0e0'); ellipse(-10, -22, 10, 14); ellipse(10, -22, 10, 14); 
    fill('#ff8a80'); ellipse(-10, -20, 6, 10); ellipse(10, -20, 6, 10);    
    fill('#f5f5f5'); rect(-16, 0, 32, 55, 12); ellipse(0, -10, 24, 24); 
    fill('#3e2723'); ellipse(-6, -10, 4, 4); ellipse(6, -10, 4, 4); 
    if (playerActionState === "EATING" && currentTurn === "MARTEN") {
        let pulse = sin(frameCount * 0.15) * 4;
        fill('#ffb74d'); ellipse(0, 15, 22 + pulse, 14 + pulse);
        fill('#fffbca'); textSize(14); text("😋", 0, -36);
    }
    pop();

    if (playerActionState === "STEALING" || playerActionState === "RETRACTING") {
        push();
        let armStartX = width * 0.3 + 12;
        let armStartY = (currentTurn === "MARTEN") ? martenY + 12 : bearY + 16; 
        let armColor = (currentTurn === "MARTEN") ? '#ffffff' : '#8d6e63';
        let armWeight = (currentTurn === "MARTEN") ? 7 : 14;
        let extendRatio = (playerActionState === "RETRACTING") ? (bearRetractTimer / (0.45 * FPS)) : (stealProgress / 100);
        
        let basketGlobalX = width * 0.6 + 35;
        let basketGlobalY = height * 0.41 + 15;
        let curX = lerp(armStartX, basketGlobalX, extendRatio);
        let curY = lerp(armStartY, basketGlobalY, extendRatio);
        
        stroke(armColor); strokeWeight(armWeight); line(armStartX, armStartY, curX, curY);
        noStroke(); fill('#ffab91'); ellipse(curX, curY, currentTurn === "MARTEN" ? 11 : 18);
        pop();
    }

    if (bubbleTimer > 0) {
        push(); translate(bubbleX, bubbleY);
        fill(255); stroke('#4e342e'); strokeWeight(2); rect(-95, -25, 190, 35, 8);
        triangle(-10, 10, 0, 18, 10, 10); noStroke();
        fill('#211510'); textStyle(BOLD); textSize(10); text(bubbleText, 0, -6); pop();
    }

    for(let i=0; i<fxPotatoes.length; i++) {
        let p = fxPotatoes[i];
        let t = 1 - (p.timer / 25);
        if(t > 0 && t <= 1) {
            push();
            let curX = lerp(p.x, p.tx, t);
            let curY = lerp(p.y, p.ty, t) - sin(t * PI) * 55; 
            translate(curX, curY); rotate(p.angle * t);
            fill('#ffb74d'); ellipse(0, 0, 20, 13);
            fill('#ffe082'); ellipse(0, -2, 14, 7);
            pop();
        }
    }

    fill('rgba(0,0,0,0.3)'); rect(width * 0.12, height * 0.9, width * 0.76, 14, 7);
    if (playerActionState === "EATING") {
        fill('#fdd835'); rect(width * 0.12, height * 0.9, width * 0.76 * (eatingTimer / (1.5 * FPS)), 14, 7);
    } else if (stealProgress > 0) {
        fill(currentTurn === "MARTEN" ? "#ffb74d" : "#d84315");
        rect(width * 0.12, height * 0.9, width * 0.76 * (stealProgress / 100), 14, 7);
    }
    
    textAlign(LEFT, CENTER); fill('#fff'); textStyle(BOLD); textSize(19); 
    text(`🥔 x ${hashBrownsCount} / ${config.target}`, 25, 40);
    textSize(11); textStyle(NORMAL); fill('#ffe082'); text(config.name, 25, 66);
    
    // 设置按钮：背景圆 + 矢量齿轮（与圆用同一原点，永远居中对齐，不受 emoji 渲染差异影响）
    push();
    let gx = width - 40, gy = 40;
    noStroke();
    fill('rgba(255,255,255,0.15)');
    ellipse(gx, gy, 36, 36);
    translate(gx, gy);
    rectMode(CENTER);
    fill('#ffffff');
    for (let i = 0; i < 8; i++) {   // 8 个齿
        push();
        rotate((TWO_PI / 8) * i);
        rect(0, -10, 4, 6, 1);
        pop();
    }
    ellipse(0, 0, 16, 16);          // 齿轮主体
    fill('#3a221d');
    ellipse(0, 0, 6, 6);            // 中心孔
    pop();
}

}

}

    fill('#4e342e'); rect(width * 0.5 - 80, height * 0.72 - 25, 160, 50, 12);

function drawGameClearScreen() {
    textAlign(CENTER, CENTER); fill('rgba(0,0,0,0.92)'); rect(0, 0, width, height);
    fill('#ffd835'); textStyle(BOLD); textSize(34); text("👑 完美大结局!! 👑", width * 0.5, height * 0.22);

    text("貂貂累得瘫在地上，最后的终极大薯饼终于被拿下啦！", width * 0.5, height * 0.36);
    text("小熊兜着一大堆薯饼和好朋友一起滚下了农场的草坪！", width * 0.5, height * 0.41);
    text("等农场主揉着眼睛回头看时，窗台已经空空如也~", width * 0.5, height * 0.46);
    fill('#ffb74d'); textStyle(BOLD); textSize(17); text("感谢你的帮忙，也别忘了奖励自己吃薯饼！🍟", width * 0.5, height * 0.56);
    fill('#8d6e63'); rect(width * 0.5 - 80, height * 0.72 - 25, 160, 50, 12);
    fill('#fff'); text("回主界面", width * 0.5, height * 0.72);

function handleTap(px, py) {
    if (currentScreen === "STORY") {
        let btnX = width * 0.5; let btnY = height * 0.84;
        if (px > btnX - 75 && px < btnX + 75 && py > btnY - 22 && py < btnY + 22) {
            if (storyIndex < storyDialogues.length - 1) {
                storyIndex++; startStoryLine();
            } else {
                currentScreen = "PLAYING";
                if(currentLevel === 2) showLevel2Guide = true;
            }
        } return;
    }
    if (showLevel2Guide) {
        let btnX = width * 0.5; let btnY = height * 0.5 + 138;
        if (px > btnX - 65 && px < btnX + 65 && py > btnY - 20 && py < btnY + 20) {
            showLevel2Guide = false;
        } return;
    }
    if (currentScreen === "HOME") {
        if (px > width*0.5 - 90 && px < width*0.5 + 90) {
            if (py > height*0.5 - 25 && py < height*0.5 + 25) {
                initLevel(currentLevel);
            } else if (py > height*0.63 - 25 && py < height*0.63 + 25) {
                currentScreen = "LEVEL_SELECT";
            }
        } return;
    }
    if (currentScreen === "LEVEL_SELECT") {
        if (px > 20 && px < 120 && py > 25 && py < 60) {
            currentScreen = "HOME"; return;
        }
        for (let i = 1; i <= 4; i++) {
            let btnY = height * 0.22 + (i - 1) * 82;
            if (i <= maxUnlockedLevel && px > width*0.15 && px < width*0.85 && py > btnY && py < btnY + 60) {
                initLevel(i); break;
            }
        } return;
    }
    if (currentScreen === "PLAYING") {
        if (px > width - 60 && px < width - 20 && py > 20 && py < 60) {
            currentScreen = "PAUSE"; return;
        }
        
        if (currentTurn === "BEAR" && playerActionState !== "EATING" && playerActionState !== "RETRACTING" && py > 80) {
            isStealing = true;
            stealProgress += 8.5; 
        }
    }
    if (currentScreen === "PAUSE") {
        for (let i = 0; i < 4; i++) {
            let bY = height * 0.38 + i * 65;
            if (px > width * 0.2 && px < width * 0.8 && py > bY && py < bY + 45) {
                if (i === 0) currentScreen = "PLAYING";
                else if (i === 1) initLevel(currentLevel);
                else if (i === 2) currentScreen = "LEVEL_SELECT";
                else if (i === 3) currentScreen = "HOME";
                break;
            }
        } return;
    }
    if (currentScreen === "GAMEOVER") {
        let btnY = height * 0.74;
        if (px > width*0.5 - 70 && px < width*0.5 + 70 && py > btnY - 25 && py < btnY + 25) {
            initLevel(currentLevel);
        } return;
    }
    if (currentScreen === "WIN_LEVEL") {
        if (px > width*0.5 - 80 && px < width*0.5 + 80) {
            if (py > height*0.58 - 25 && py < height*0.58 + 25) {
                currentLevel++; initLevel(currentLevel);
            } else if (py > height*0.7 - 25 && py < height*0.7 + 25) {
                currentScreen = "LEVEL_SELECT";
            }
        } return;
    }
    if (currentScreen === "GAME_CLEAR") {
        let btnY = height * 0.72;
        if (px > width*0.5 - 80 && px < width*0.5 + 80 && py > btnY - 25 && py < btnY + 25) {
            currentLevel = 1; currentScreen = "HOME";
        } return;
    }
}

// 鼠标（桌面）：用 p5 的 mouseX/mouseY
function mousePressed() {
    handleTap(mouseX, mouseY);
}

// 从触摸事件直接取坐标，换算成画布内坐标（绕开 p5 坐标延迟导致的“要点两下”）
function getTouchPos(e) {
    let t = null;
    if (e && e.touches && e.touches.length) t = e.touches[0];
    else if (e && e.changedTouches && e.changedTouches.length) t = e.changedTouches[0];
    if (t && canvasEl) {
        let r = canvasEl.getBoundingClientRect();
        return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    return { x: mouseX, y: mouseY };
}

// 触摸（手机）：用触摸事件的真实坐标，并阻止浏览器默认行为（滚动/缩放/下拉刷新/合成鼠标事件）
function touchStarted(e) {
    let p = getTouchPos(e);
    handleTap(p.x, p.y);
    return false;
}
function touchMoved() {
    return false;   // 按住偷饼时手指微动，不让页面滚动
}
function touchEnded() {
    return false;
}

function saveProgress(nextLvl) {
    if (nextLvl > maxUnlockedLevel && nextLvl <= 4) {
        maxUnlockedLevel = nextLvl;
        localStorage.setItem("marten_bear_max_level", maxUnlockedLevel);
    }
    localStorage.setItem("marten_bear_current_level", currentLevel);
}

function loadProgress() {
    let savedMax = localStorage.getItem("marten_bear_max_level");
    if (savedMax) maxUnlockedLevel = parseInt(savedMax);
    let savedCur = localStorage.getItem("marten_bear_current_level");
    if (savedCur) currentLevel = parseInt(savedCur);
}
